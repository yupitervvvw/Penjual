<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>UX Research Penjual Tenun</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:'Segoe UI';
background:linear-gradient(135deg,#ff7e5f,#feb47b);
margin:0;
}

.container{
max-width:900px;
margin:20px auto;
background:white;
padding:20px;
border-radius:15px;
}

h1{text-align:center;}

.section{
margin-top:20px;
padding:15px;
background:#fff4f0;
border-radius:10px;
}

.question{margin-bottom:15px;}

label{font-weight:bold;}

input,select{
width:100%;
padding:8px;
margin-top:5px;
border-radius:6px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
cursor:pointer;
}

.generate{background:#ff7e5f;color:white;}
.print{background:#00b894;color:white;}

.persona{
display:flex;
gap:15px;
background:#fff;
padding:15px;
border-radius:10px;
margin-top:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.avatar{
width:70px;
height:70px;
background:#ff7e5f;
color:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
}

.step{
background:#fff4f0;
padding:10px;
margin:5px 0;
border-left:4px solid #ff7e5f;
border-radius:6px;
}
</style>
</head>

<body>

<div class="container">
<h1>🧵 UX Research Penjual Tenun</h1>

<!-- I DATA -->
<div class="section">
<h2>I. Data Responden (Penjual)</h2>

<div class="question">
<label>Nama Usaha / UMKM</label>
<input id="usaha">
</div>

<div class="question">
<label>Nama Pemilik</label>
<input id="nama">
</div>

<div class="question">
<label>Lama Berusaha</label>
<select id="lama">
<option>< 1 tahun</option>
<option>1-3 tahun</option>
<option>3-5 tahun</option>
<option>5-10 tahun</option>
<option>> 10 tahun</option>
</select>
</div>

<div class="question">
<label>Skala Produksi per bulan</label>
<select id="produksi">
<option>< 10 kain</option>
<option>10-30 kain</option>
<option>30-50 kain</option>
<option>50-100 kain</option>
<option>> 100 kain</option>
</select>
</div>

</div>

<!-- II BEHAVIOR -->
<div class="section">
<h2>II. Behavior</h2>

<div class="question">
<label>Media penjualan saat ini</label>
<select id="b1">
<option>Toko fisik</option>
<option>WhatsApp</option>
<option>Marketplace</option>
<option>Instagram</option>
<option>Kombinasi semua</option>
</select>
</div>

<div class="question">
<label>Cara menjelaskan keaslian/motif</label>
<select id="b2">
<option>Cerita langsung ke pembeli</option>
<option>Kirim foto/video</option>
<option>Testimoni pelanggan</option>
<option>Sertifikat manual</option>
<option>Tidak dijelaskan detail</option>
</select>
</div>

<div class="question">
<label>Cara promosi produk baru</label>
<select id="b3">
<option>Posting sosial media</option>
<option>Broadcast WhatsApp</option>
<option>Diskon/promo</option>
<option>Rekomendasi pelanggan</option>
<option>Tidak ada strategi khusus</option>
</select>
</div>

</div>

<!-- III PAIN -->
<div class="section">
<h2>III. Pain Points</h2>

<div class="question">
<label>Kesulitan jual online</label>
<select id="p1">
<option>Foto produk sulit</option>
<option>Harga sering ditawar</option>
<option>Pengiriman</option>
<option>Kurang pembeli</option>
<option>Tidak ada kendala</option>
</select>
</div>

<div class="question">
<label>Pembeli ragu keaslian?</label>
<select id="p2">
<option>Sering</option>
<option>Kadang</option>
<option>Jarang</option>
<option>Tidak pernah</option>
<option>Tidak tahu</option>
</select>
</div>

<div class="question">
<label>Kendala kelola stok/pesanan</label>
<select id="p3">
<option>Sulit mencatat</option>
<option>Data tercecer</option>
<option>Banyak pesanan bingung</option>
<option>Tidak teratur</option>
<option>Tidak ada kendala</option>
</select>
</div>

</div>

<!-- IV NEEDS -->
<div class="section">
<h2>IV. Needs</h2>

<div class="question">
<label>Fitur paling membantu</label>
<select id="n1">
<option>Stok otomatis</option>
<option>Verifikasi keaslian</option>
<option>Galeri produk</option>
<option>Manajemen pesanan</option>
<option>Semua fitur</option>
</select>
</div>

<div class="question">
<label>Perlu profil pengrajin?</label>
<select id="n2">
<option>Sangat perlu</option>
<option>Perlu</option>
<option>Biasa saja</option>
<option>Tidak perlu</option>
<option>Tidak penting</option>
</select>
</div>

<div class="question">
<label>Pendapat tentang pre-order</label>
<select id="n3">
<option>Sangat setuju</option>
<option>Setuju</option>
<option>Biasa saja</option>
<option>Tidak setuju</option>
<option>Tidak perlu</option>
</select>
</div>

</div>

<button class="generate" onclick="gen()">🚀 Generate</button>
<button class="print" onclick="window.print()">🖨️ Print</button>

<div id="out"></div>

</div>

<script>
function gen(){

let nama = document.getElementById("nama").value;
let usaha = document.getElementById("usaha").value;

let hasil = `
<div class="persona">
<div class="avatar">${usaha.charAt(0)}</div>
<div>
<h2>${usaha}</h2>
<p>Pemilik: ${nama}</p>
<p><b>Pengalaman:</b> ${lama.value}</p>
<p><b>Produksi:</b> ${produksi.value}</p>

<p><b>Behavior:</b> ${b1.value}, ${b3.value}</p>
<p><b>Pain:</b> ${p1.value}, ${p2.value}, ${p3.value}</p>
<p><b>Needs:</b> ${n1.value}, ${n2.value}, ${n3.value}</p>
</div>
</div>

<h2>🧵 Journey Penjual</h2>
<div class="step">Promosi → ${b3.value}</div>
<div class="step">Interaksi → ${b2.value}</div>
<div class="step">Masalah → ${p1.value}</div>
<div class="step">Penjualan → Transaksi</div>
<div class="step">Harapan → ${n1.value}</div>
`;

document.getElementById("out").innerHTML = hasil;
}
</script>

</body>
</html>
